[mcp_servers.discord-two-way]
command = "bun"
args = [
  "run",
  "/{path-to}/discord-two-way-mcp/src/index.ts"
]

[mcp_servers.discord-two-way.env]
DISCORD_BOT_TOKEN = "YOUR_TOKEN_HERE"
GEMINI_API_KEY = "YOUR_GEMINI_API_KEY_HERE"  # オプション：設定すると添付ファイルを解析
DISCORD_MCP_BOT_ID = "YOUR_BOT_USER_ID"  # オプション：ログイン前の重複起動検知
DISCORD_MCP_DUPLICATE_POLICY = "fail"  # オプション：kill または fail
DISCORD_MCP_IGNORE_CHANNELS = "CHANNEL_ID_1,CHANNEL_ID_2"  # オプション

# 音声自動参加・録音を使う場合は次の3項目をすべて設定
# DISCORD_VOICE_AUTOJOIN_CHANNEL_ID = "VOICE_CHANNEL_ID"
# DISCORD_VOICE_AUTOJOIN_USER_IDS = "TRIGGER_USER_ID_1,TRIGGER_USER_ID_2"
# DISCORD_VOICE_RECORDING_DIR = "/absolute/path/to/recordings"
# DISCORD_VOICE_RECORD_USER_IDS = "RECORD_USER_ID_1,RECORD_USER_ID_2"
